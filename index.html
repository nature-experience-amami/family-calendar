<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>家族カレンダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1 class="title">家族カレンダー</h1>
      <button id="meBtn" class="me" type="button" hidden></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="表示の切り替え">
      <button class="tab" role="tab" data-view="today" aria-selected="true">今日</button>
      <button class="tab" role="tab" data-view="week" aria-selected="false">週</button>
      <button class="tab" role="tab" data-view="family" aria-selected="false">家族</button>
    </nav>
  </header>

  <main id="view" class="view">
    <p class="empty">読み込み中…</p>
  </main>

  <!-- 初回だけ：招待コードと自分を選ぶ -->
  <section id="joinScreen" class="join" hidden>
    <form id="joinForm">
      <h2 id="joinTitle">家族グループに参加</h2>
      <p class="join-lead">家族から教えてもらった招待コードを入れて、自分を選んでください。</p>
      <label class="field">
        <span>招待コード</span>
        <input name="code" type="text" required autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <fieldset>
        <legend>あなたは？</legend>
        <div id="joinPicker" class="chips"></div>
      </fieldset>
      <p id="joinError" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="joinCancel" class="btn ghost" hidden>やめる</button>
        <button type="submit" class="btn primary">参加する</button>
      </div>
    </form>
  </section>

  <button id="addBtn" class="fab" aria-label="予定を追加" hidden>＋ 予定を追加</button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 予定の追加 -->
  <dialog id="addDialog" class="sheet">
    <form id="addForm" method="dialog">
      <h2>予定を追加</h2>

      <fieldset>
        <legend>誰の</legend>
        <div id="memberPicker" class="chips"></div>
      </fieldset>

      <label class="field">
        <span>何</span>
        <input name="title" type="text" required maxlength="40" placeholder="例：サッカー練習">
      </label>

      <div class="row">
        <label class="field">
          <span>いつ（日付）</span>
          <input name="date" type="date" required>
        </label>
        <label class="field">
          <span>時間</span>
          <input name="start" type="time" required>
        </label>
      </div>

      <label class="switch">
        <input id="rideToggle" name="ride" type="checkbox">
        <span class="slider" aria-hidden="true"></span>
        <span>送迎が必要</span>
      </label>

      <div id="rideFields" class="ride-fields" hidden>
        <div class="row">
          <label class="check"><input name="goOn" type="checkbox" checked> 行き</label>
          <input name="goTime" type="time" aria-label="行きの時間">
        </div>
        <div class="row">
          <label class="check"><input name="backOn" type="checkbox" checked> 帰り</label>
          <input name="backTime" type="time" aria-label="帰りの時間">
        </div>
      </div>

      <p id="formError" class="error" role="alert"></p>

      <div class="actions">
        <button type="button" id="cancelAdd" class="btn ghost">やめる</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 送迎の担当決め -->
  <dialog id="rideDialog" class="sheet">
    <form method="dialog">
      <h2 id="rideTitle">誰が行く？</h2>
      <p id="rideInfo" class="ride-info"></p>
      <div class="actions column">
        <button type="button" class="btn driver" data-driver="papa">パパが行く</button>
        <button type="button" class="btn driver" data-driver="mama">ママが行く</button>
        <button type="button" id="cancelRide" class="btn ghost">やめる</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>家族カレンダー</title>
  <meta name="apple-mobile-web-app-title" content="家族カレンダー">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1 class="title">家族カレンダー</h1>
      <button id="meBtn" class="me" type="button" aria-haspopup="dialog" hidden></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="表示の切り替え">
      <button class="tab" role="tab" data-view="today" aria-selected="true">今日</button>
      <button class="tab" role="tab" data-view="week" aria-selected="false">週</button>
      <button class="tab" role="tab" data-view="month" aria-selected="false">月</button>
      <button class="tab" role="tab" data-view="family" aria-selected="false">家族</button>
    </nav>
  </header>

  <main id="view" class="view">
    <p class="empty">読み込み中…</p>
  </main>

  <!-- 初回だけ：招待コードと自分を選ぶ -->
  <section id="joinScreen" class="join" hidden>
    <form id="joinForm">
      <h2 id="joinTitle">家族グループに参加</h2>
      <p class="join-lead">家族から教えてもらった招待コードを入れて、自分を選んでください。</p>
      <label class="field">
        <span>招待コード</span>
        <input name="code" type="text" required autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <fieldset>
        <legend>あなたは？</legend>
        <div id="joinPicker" class="chips"></div>
      </fieldset>
      <p id="joinError" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="joinCancel" class="btn ghost" hidden>やめる</button>
        <button type="submit" class="btn primary">参加する</button>
      </div>
    </form>
  </section>

  <button id="addBtn" class="fab" aria-label="予定を追加" hidden>＋ 予定を追加</button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 予定の追加 -->
  <dialog id="addDialog" class="sheet">
    <form id="addForm" method="dialog" novalidate>
      <h2 id="editorTitle">予定を追加</h2>

      <fieldset>
        <legend>誰の</legend>
        <div id="memberPicker" class="chips"></div>
      </fieldset>

      <label class="field">
        <span>何</span>
        <input name="title" type="text" required maxlength="40" placeholder="例：サッカー練習">
      </label>

      <div class="row">
        <label class="field">
          <span>いつ（日付）</span>
          <input name="date" type="date" required>
        </label>
        <label class="field" id="endDateBox">
          <span>終わりの日（任意）</span>
          <input name="endDate" type="date">
        </label>
      </div>

      <fieldset class="repeat-box">
        <legend>くり返し</legend>
        <div id="repeatSeg" class="seg" role="radiogroup" aria-label="くり返し">
          <button type="button" role="radio" data-freq="none">なし</button>
          <button type="button" role="radio" data-freq="daily">毎日</button>
          <button type="button" role="radio" data-freq="weekly">毎週</button>
          <button type="button" role="radio" data-freq="monthly">毎月</button>
        </div>
        <div id="repeatDays" class="offday-grid repeat-days" role="group" aria-label="くり返す曜日" hidden></div>
        <p id="repeatMonthly" class="hint" hidden></p>
        <label class="field" id="repeatUntilBox" hidden>
          <span>くり返しの終わりの日（任意。空欄なら続ける）</span>
          <input name="repeatUntil" type="date">
        </label>
      </fieldset>

      <label class="switch">
        <input id="allDayToggle" name="allDay" type="checkbox">
        <span class="slider" aria-hidden="true"></span>
        <span>終日</span>
      </label>

      <div id="timeFields" class="row">
        <label class="field">
          <span>開始時間</span>
          <input name="start" type="time">
        </label>
        <label class="field">
          <span>終了時間（任意）</span>
          <input name="end" type="time">
        </label>
      </div>

      <label class="switch">
        <input id="rideToggle" name="ride" type="checkbox">
        <span class="slider" aria-hidden="true"></span>
        <span>送迎が必要</span>
      </label>

      <div id="rideFields" class="ride-fields" hidden>
        <div class="row">
          <label class="check"><input name="goOn" type="checkbox" checked> 行き（送り）</label>
          <input name="goTime" type="time" aria-label="送りの時間">
        </div>
        <div class="row">
          <label class="check"><input name="backOn" type="checkbox" checked> 帰り（お迎え）</label>
          <input name="backTime" type="time" aria-label="お迎えの時間">
        </div>
      </div>

      <p id="formError" class="error" role="alert"></p>

      <div class="actions">
        <button type="button" id="deleteEvent" class="btn danger" hidden>削除</button>
        <button type="button" id="cancelAdd" class="btn ghost">やめる</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- くり返しの予定の「この日だけ／これ以降すべて」、削除の確認 -->
  <dialog id="chooseDialog" class="sheet">
    <form method="dialog">
      <h2 id="chooseTitle"></h2>
      <p id="chooseInfo" class="ride-info"></p>
      <div id="chooseButtons" class="actions column"></div>
    </form>
  </dialog>

  <!-- 送迎の担当決め -->
  <dialog id="rideDialog" class="sheet">
    <form method="dialog">
      <h2 id="rideTitle">誰が行く？</h2>
      <p id="rideInfo" class="ride-info"></p>
      <div class="actions column">
        <button type="button" class="btn driver m-father" data-driver="father">父が行く</button>
        <button type="button" class="btn driver m-mother" data-driver="mother">母が行く</button>
        <button type="button" id="cancelRide" class="btn ghost">やめる</button>
      </div>
    </form>
  </dialog>

  <!-- 右上の「自分」ボタンのメニュー -->
  <dialog id="menuDialog" class="sheet">
    <form method="dialog" class="menu">
      <h2 id="menuTitle">メニュー</h2>
      <div class="actions column">
        <button type="button" id="openProfiles" class="btn">名前・アイコン・休み</button>
        <button type="button" id="openSwitchMe" class="btn">自分を変える</button>
        <button type="submit" class="btn ghost">閉じる</button>
      </div>
    </form>
  </dialog>

  <!-- 名前とアイコン -->
  <dialog id="profileDialog" class="sheet">
    <form id="profileForm" novalidate>
      <h2>名前・アイコン・休み</h2>
      <div id="whoTabs" class="who-tabs" role="group" aria-label="誰を変えるか"></div>
      <div id="profilePreview" class="preview" aria-live="polite"></div>
      <label class="field">
        <span>名前（1〜10文字）</span>
        <input name="name" type="text" required maxlength="10" autocomplete="off">
      </label>
      <fieldset>
        <legend>アイコン</legend>
        <div id="iconGrid" class="icon-grid" role="radiogroup" aria-label="アイコン"></div>
      </fieldset>
      <fieldset>
        <legend>いつも休みの曜日</legend>
        <div id="offDayGrid" class="offday-grid" role="group" aria-label="いつも休みの曜日"></div>
      </fieldset>
      <label class="switch">
        <input id="holidayOffToggle" type="checkbox">
        <span class="slider" aria-hidden="true"></span>
        <span>祝日は休み</span>
      </label>
      <p class="hint">決まりと違う日（祝日の出勤・振替の休み・土曜の登校日など）は、月の表示で日付を押して「お休み」で変えられます。</p>
      <p id="profileError" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="closeProfiles" class="btn ghost">閉じる</button>
        <button type="submit" class="btn primary">保存する</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
